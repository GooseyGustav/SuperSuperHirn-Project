stages:
  - lint
  - test
  - quality

image: python:3.12

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  QT_QPA_PLATFORM: offscreen

before_script:
  - apt-get update
  - apt-get install -y libgl1 libglib2.0-0
  - pip install -e .[dev]

flake8:
  stage: lint
  script:
    - flake8 src/
  allow_failure: true

unit_tests:
  stage: test
  script:
    - pytest tests/unit --cov=src --cov-report=term --cov-report=xml --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  allow_failure: true

integration_tests:
  stage: test
  script:
    - pytest tests/integration
  allow_failure: true

complexity:
  stage: quality
  script:
    - radon cc src/ -a -nb
  allow_failure: true
